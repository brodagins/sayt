<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Создание сайтов</title>
<!-- Библиотека Telegram: даёт имя пользователя, цвета темы и кнопку внизу экрана.
     Если страница открыта не в Telegram, прототип всё равно работает. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    /* Цвета берутся из темы Telegram; после запятой — запасные значения для обычного браузера */
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2481cc);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) {
      --bg: #17212b; --bg2: #0e1621; --text: #f5f5f5; --hint: #708499;
      --accent: #5288c1; --link: #6ab3f3;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg2);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 76px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  .hello { color: var(--hint); font-size: 14px; margin: 4px 0 12px; }

  .hero {
    background: var(--accent); color: var(--accent-text);
    border-radius: var(--radius); padding: 20px;
  }
  .hero h1 { font-size: 22px; line-height: 1.2; margin: 0 0 8px; }
  .hero p { margin: 0 0 16px; opacity: .9; }
  .hero button {
    background: var(--accent-text); color: var(--accent);
    border: 0; border-radius: 10px; padding: 10px 16px;
    font: inherit; font-weight: 600; cursor: pointer;
  }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
  .tile {
    background: var(--bg); border: 0; border-radius: var(--radius);
    padding: 12px 4px; text-align: center; color: var(--text);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .tile .ico { display: block; font-size: 24px; margin-bottom: 4px; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--hint); font-weight: 600; margin: 20px 4px 8px; }
  .list { background: var(--bg); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--bg2); cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row .ico { font-size: 22px; width: 32px; text-align: center; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { color: var(--hint); font-size: 13px; }
  .row .price { color: var(--link); font-weight: 600; white-space: nowrap; }

  .works { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .works::-webkit-scrollbar { display: none; }
  .work {
    flex: 0 0 150px; height: 100px; border-radius: var(--radius);
    display: flex; align-items: flex-end; padding: 10px;
    color: #fff; font-weight: 600; font-size: 13px;
  }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--bg);
    border-top: 1px solid var(--bg2);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tabs button {
    flex: 1; background: none; border: 0; color: var(--hint);
    font: inherit; font-size: 11px; cursor: pointer;
  }
  .tabs button .ico { display: block; font-size: 20px; }
  .tabs button.on { color: var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 8px 14px;
    border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hello" id="hello">Здравствуйте!</div>

  <section class="hero">
    <h1>Сайт для вашего бизнеса</h1>
    <p>Лендинги, сайты-визитки и интернет-магазины под ключ.</p>
    <button type="button" data-soon="Форма заявки">Рассчитать стоимость</button>
  </section>

  <nav class="grid">
    <button class="tile" type="button" data-soon="Услуги"><span class="ico">🛠</span>Услуги</button>
    <button class="tile" type="button" data-soon="Портфолио"><span class="ico">🖼</span>Работы</button>
    <button class="tile" type="button" data-soon="Цены"><span class="ico">💰</span>Цены</button>
    <button class="tile" type="button" data-soon="Связь с нами"><span class="ico">💬</span>Связь</button>
  </nav>

  <h2>Популярные услуги</h2>
  <div class="list" id="services"></div>

  <h2>Наши работы</h2>
  <div class="works" id="works"></div>
</div>

<nav class="tabs">
  <button type="button" class="on"><span class="ico">🏠</span>Главная</button>
  <button type="button" data-soon="Каталог услуг"><span class="ico">🛠</span>Услуги</button>
  <button type="button" data-soon="Мои заявки"><span class="ico">📋</span>Заявки</button>
  <button type="button" data-soon="Профиль"><span class="ico">👤</span>Профиль</button>
</nav>

<div class="toast" id="toast"></div>

<script>
  // Примерные данные для прототипа — потом заменим на ваши
  var SERVICES = [
    { ico: "🚀", title: "Лендинг", sub: "Одна страница под рекламу", price: "от 15 000 ₽" },
    { ico: "🏢", title: "Сайт-визитка", sub: "До 5 страниц о компании", price: "от 25 000 ₽" },
    { ico: "🛒", title: "Интернет-магазин", sub: "Каталог, корзина, оплата", price: "от 60 000 ₽" },
    { ico: "🔧", title: "Доработка сайта", sub: "Правки, ускорение, SEO", price: "от 3 000 ₽" }
  ];
  var WORKS = [
    { title: "Кофейня", color: "#c0793b" },
    { title: "Автосервис", color: "#3b6fc0" },
    { title: "Салон красоты", color: "#b04a8a" },
    { title: "Стоматология", color: "#2f9e8f" }
  ];

  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.initData);

  function e(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  document.getElementById("services").innerHTML = SERVICES.map(function (s) {
    return '<div class="row" data-soon="' + e(s.title) + '">' +
      '<span class="ico">' + s.ico + '</span>' +
      '<div class="main"><div class="title">' + e(s.title) + '</div>' +
      '<div class="sub">' + e(s.sub) + '</div></div>' +
      '<span class="price">' + e(s.price) + '</span></div>';
  }).join("");

  document.getElementById("works").innerHTML = WORKS.map(function (w) {
    return '<div class="work" style="background:' + w.color + '" data-soon="Работа: ' + e(w.title) + '">' +
      e(w.title) + '</div>';
  }).join("");

  var toastTimer;
  function soon(name) {
    var t = document.getElementById("toast");
    t.textContent = "«" + name + "» — появится в следующей версии";
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-soon]");
    if (el) soon(el.getAttribute("data-soon"));
  });

  if (inTelegram) {
    document.documentElement.setAttribute("data-tg", "");
    tg.ready();
    tg.expand();
    var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user && user.first_name) {
      document.getElementById("hello").textContent = "Здравствуйте, " + user.first_name + "!";
    }
    // Большая кнопка Telegram внизу экрана
    tg.MainButton.setText("Оставить заявку");
    tg.MainButton.show();
    tg.MainButton.onClick(function () { soon("Форма заявки"); });
  }
</script>
</body>
</html>
